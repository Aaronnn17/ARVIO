name: One-off IPTV playlist limit 5 patch

on:
  push:
    branches:
      - test/iptv-playlist-limit-5

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v5
        with:
          ref: test/iptv-playlist-limit-5
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Apply guarded playlist-limit patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          repo = Path('app/src/main/kotlin/com/arflix/tv/data/repository/IptvRepository.kt')
          text = repo.read_text()

          schema_anchor = 'internal const val IPTV_GROUP_ORDER_SCHEMA = 3\n'
          if text.count(schema_anchor) != 1:
              raise SystemExit(f'Expected one IPTV_GROUP_ORDER_SCHEMA anchor, found {text.count(schema_anchor)}')
          text = text.replace(
              schema_anchor,
              schema_anchor + 'internal const val MAX_IPTV_PLAYLISTS = 5\n',
              1,
          )

          cap_expr = '.filterNotNull().take(3)'
          if text.count(cap_expr) != 2:
              raise SystemExit(f'Expected exactly two playlist take(3) caps, found {text.count(cap_expr)}')
          text = text.replace(cap_expr, '.filterNotNull().take(MAX_IPTV_PLAYLISTS)')
          repo.write_text(text)

          screen = Path('app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt')
          text = screen.read_text()

          import_anchor = 'import com.arflix.tv.data.repository.IptvPlaylistEntry\n'
          if text.count(import_anchor) != 1:
              raise SystemExit(f'Expected one IptvPlaylistEntry import, found {text.count(import_anchor)}')
          text = text.replace(
              import_anchor,
              import_anchor + 'import com.arflix.tv.data.repository.MAX_IPTV_PLAYLISTS\n',
              1,
          )

          count_expr = '"${uiState.iptvPlaylists.size}/3"'
          if text.count(count_expr) != 1:
              raise SystemExit(f'Expected one playlist x/3 fact, found {text.count(count_expr)}')
          text = text.replace(count_expr, '"${uiState.iptvPlaylists.size}/$MAX_IPTV_PLAYLISTS"')

          threshold = 'playlists.size >= 3'
          if text.count(threshold) != 2:
              raise SystemExit(f'Expected two UI playlist >= 3 checks, found {text.count(threshold)}')
          text = text.replace(threshold, 'playlists.size >= MAX_IPTV_PLAYLISTS')
          screen.write_text(text)

          strings = Path('app/src/main/res/values/strings.xml')
          text = strings.read_text()
          replacements = {
              'Add up to 3 M3U / Xtream IPTV lists with names': 'Add up to 5 M3U / Xtream IPTV lists with names',
              'Add up to 3 M3U / Xtream TV lists': 'Add up to 5 M3U / Xtream TV lists',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one string {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          strings.write_text(text)

          # Sanity checks: the two intended persistence/import caps must now use the shared limit.
          patched = repo.read_text()
          if patched.count('.filterNotNull().take(MAX_IPTV_PLAYLISTS)') != 2:
              raise SystemExit('Playlist cap replacement sanity check failed')
          if '.filterNotNull().take(3)' in patched:
              raise SystemExit('A playlist take(3) cap remains unexpectedly')
          PY

      - name: Prepare placeholder build configuration
        run: cp secrets.defaults.properties secrets.properties

      - name: Run standard unit-test suite
        run: ./gradlew testSideloadDebugUnitTest --no-daemon

      - name: Commit tested patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-off-iptv-playlist-limit-5.yml
          git add app/src/main/kotlin/com/arflix/tv/data/repository/IptvRepository.kt \
                  app/src/main/kotlin/com/arflix/tv/ui/screens/settings/SettingsScreen.kt \
                  app/src/main/res/values/strings.xml
          git diff --cached --check
          git commit -m "test: raise IPTV playlist cap from 3 to 5"
          git push origin HEAD:test/iptv-playlist-limit-5
