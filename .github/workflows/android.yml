name: Compilar APK

on:
  workflow_dispatch: # Esto es la magia que crea el botón para ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permisos de ejecución a Gradle
      run: chmod +x gradlew

    - name: Compilar la App (Modo Debug)
      run: ./gradlew assembleDebug

    - name: Guardar el APK para descargar
      uses: actions/upload-artifact@v4
      with:
        name: ARVIO-APK
        path: app/build/outputs/apk/debug/*.apk
