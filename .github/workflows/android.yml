name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compilar la App
      uses: gradle/actions/setup-gradle@v3
      with:
        arguments: assemble

    - name: Buscar todos los APKs generados (por si están en otra carpeta)
      run: find . -name "*.apk"

    - name: Guardar los APKs para descargar
      uses: actions/upload-artifact@v4
      with:
        name: ARVIO-APK
        path: '**/*.apk'
