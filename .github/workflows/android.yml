name: Compilar APK Sideload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Dar permisos al ejecutable
      run: chmod +x gradlew

    - name: Compilar la App (Versión Sideload)
      run: ./gradlew :app:assembleSideloadDebug

    - name: Guardar el APK para descargar
      uses: actions/upload-artifact@v4
      with:
        name: ARVIO-APK
        path: app/build/outputs/apk/sideload/debug/*.apk
