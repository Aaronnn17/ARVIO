name: One-off build IPTV limit 5 test APK

on:
  push:
    branches:
      - test/iptv-playlist-limit-5

permissions:
  contents: read

jobs:
  build-test-apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v5
        with:
          ref: test/iptv-playlist-limit-5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare placeholder build configuration
        run: cp secrets.defaults.properties secrets.properties

      - name: Build sideload debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-iptv-limit-5-test-apk
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 3
