name: Build test APK (debug, parallel app id)

on:
  push:
    branches:
      - feat/stalker-live-config
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Placeholder config
        run: cp secrets.defaults.properties secrets.properties

      - name: Parallel-install app id (.stalker-live)
        run: sed -i 's/        debug {/        debug {\n            applicationIdSuffix = ".stalker-live"/' app/build.gradle.kts

      - name: Build debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-stalker-live-test
          path: app/build/outputs/apk/sideload/debug/*.apk
