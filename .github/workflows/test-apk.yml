name: Build test APK (debug, parallel app id)

on:
  push:
    branches:
      - feat/stalker-live-config
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Placeholder config
        run: cp secrets.defaults.properties secrets.properties

      - name: Parallel-install app id (.stalkerlive)
        run: sed -i 's/        debug {/        debug {\n            applicationIdSuffix = ".stalkerlive"/' app/build.gradle.kts

      - name: Bump versionCode so Android allows in-place update
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          sed -i "s/versionCode = [0-9]*/versionCode = $((310 + BUILD_NUMBER))/" app/build.gradle.kts
          echo "Bumped versionCode to $((310 + BUILD_NUMBER)) for run $BUILD_NUMBER"

      - name: Build debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-stalkerlive-test
          path: app/build/outputs/apk/sideload/debug/*.apk
